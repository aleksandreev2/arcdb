<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Reset password - ArchiveDB</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="/static/css/auth.css?v=6b2592e1cec84acc">
</head>
<body>
  <main class="card">
    <div class="brand">Archive<span>DB</span></div>
    <div class="badge">Reset password</div>
    <h1>Set new password</h1>
    <p class="subtitle">Enter the reset code from your email and choose a new password.</p>
    <div class="info">
      Enter the same email where you received the reset code.
    </div>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
    <form method="post" action="{{ url_for('reset_password') }}">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" value="{{ email if email else '' }}" placeholder="you@example.com" autocomplete="email" required>
      <label for="code">Reset code</label>
      <input id="code" name="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="6-digit code" autocomplete="one-time-code" required>
      <label for="password">New password</label>
      <input id="password" name="password" type="password" placeholder="New password, 8+ characters" autocomplete="new-password" minlength="8" required>
      <button type="submit">Reset password</button>
    </form>
    <div class="links">
      <a href="{{ url_for('forgot_password') }}">Request a new code</a>
      <span>&middot;</span>
      <a href="{{ url_for('login') }}">Back to login</a>
    </div>
  </main>
</body>
</html>
