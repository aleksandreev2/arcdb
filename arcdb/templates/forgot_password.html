<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Forgot password - ArchiveDB</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="{{ static_asset_url('css/auth.css') }}">
</head>
<body>
  <main class="card">
    <div class="brand">Archive<span>DB</span></div>
    <div class="badge">Account recovery</div>
    <h1>Forgot password?</h1>
    <p class="subtitle">Enter your approved email. A reset code will be sent if the account exists.</p>
    <div class="notice">
      If your email is not currently approved, send your email to <strong>@sigma619</strong> again to get access.
    </div>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
    <form method="post" action="{{ url_for('forgot_password') }}">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
      <button type="submit">Send reset code</button>
    </form>
    <div class="links">
      <a href="{{ url_for('login') }}">Back to login</a>
    </div>
  </main>
</body>
</html>
