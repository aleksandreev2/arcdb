<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Verify email - ArchiveDB</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="/static/css/auth.css?v=6b2592e1cec84acc">
</head>
<body>
  <main class="card">
    <div class="brand">Archive<span>DB</span></div>
    <div class="badge">Email verification</div>
    <h1>Enter your code</h1>
    <p class="subtitle">We sent a 6-digit verification code to your email.</p>
    <div class="info">
      Code sent to:<br>
      <strong>{{ email }}</strong>
    </div>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
    <form method="post" action="{{ url_for('verify') }}">
      <input type="hidden" name="email" value="{{ email }}">
      <label for="code">Verification code</label>
      <input id="code" name="code" class="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="6-digit code" autocomplete="one-time-code" required>
      <button type="submit">Verify email</button>
    </form>
    <div class="links">
      <span>Did not get it?</span>
      <a href="{{ url_for('register') }}">Register again</a>
    </div>
    <div class="footer">Codes expire quickly. If yours expired, register again to generate a new one.</div>
  </main>
</body>
</html>
