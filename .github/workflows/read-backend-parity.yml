name: State Read Backend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  read-backend-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare identical seeded legacy and SQLite state
        run: |
          CI=1 python scripts/dev_bootstrap.py --setup-only
          .venv/bin/python tests/make_seed_fixtures.py dev-fixtures/inbox/Downloads.zip
          CI=1 python scripts/dev_bootstrap.py --setup-only --auto-seed-if-empty

      - name: Compare real Flask API output across read backends
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .env
          set +a
          PYTHONPATH=. PORT=5004 STATE_READ_BACKEND=legacy \
            STATE_READ_SHADOW_COMPARE=1 STATE_READ_SHADOW_STRICT=1 \
            STATE_READ_SHADOW_REPORT_EVERY=1 ARCHIVEDB_AUTH_TEST_MODE=1 \
            .venv/bin/python .runtime/source/gallery_app.py > legacy-server.log 2>&1 &
          LEGACY_PID=$!
          PYTHONPATH=. PORT=5005 STATE_READ_BACKEND=sqlite ARCHIVEDB_AUTH_TEST_MODE=1 \
            .venv/bin/python .runtime/source/gallery_app.py > sqlite-server.log 2>&1 &
          CANDIDATE_PID=$!
          cleanup() {
            if [[ -n "${LEGACY_PID:-}" ]]; then
              kill "$LEGACY_PID" 2>/dev/null || true
            fi
            if [[ -n "${CANDIDATE_PID:-}" ]]; then
              kill "$CANDIDATE_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          wait_for_server() {
            local port="$1"
            local pid="$2"
            local log="$3"
            for attempt in $(seq 1 120); do
              if curl --fail --silent "http://127.0.0.1:${port}/login" >/dev/null; then
                return 0
              fi
              if ! kill -0 "$pid" 2>/dev/null; then
                cat "$log"
                return 1
              fi
              sleep 1
            done
            echo "Server on port ${port} did not become ready."
            cat "$log"
            return 1
          }

          wait_for_server 5004 "$LEGACY_PID" legacy-server.log
          wait_for_server 5005 "$CANDIDATE_PID" sqlite-server.log

          PYTHONPATH=. .venv/bin/python tests/runtime_read_parity.py
          ARCHIVEDB_TEST_BASE_URL=http://127.0.0.1:5005 \
            PYTHONPATH=. .venv/bin/python tests/runtime_collection_workflow.py
          ARCHIVEDB_TEST_BASE_URL=http://127.0.0.1:5005 \
            PYTHONPATH=. .venv/bin/python tests/runtime_metadata_workflow.py
          ARCHIVEDB_TEST_BASE_URL=http://127.0.0.1:5005 \
            PYTHONPATH=. .venv/bin/python tests/runtime_auth_workflow.py
          PYTHONPATH=. .venv/bin/python scripts/verify_state_parity.py
          PYTHONPATH=. .venv/bin/python scripts/verify_read_cutover_readiness.py \
            --meta-dir data/metadata \
            --db data/arcdb.sqlite3

          kill "$LEGACY_PID"
          wait "$LEGACY_PID" || true
          LEGACY_PID=""

          PYTHONPATH=. .venv/bin/python scripts/verify_read_shadow_observation.py \
            --log legacy-server.log \
            --report shadow-observation.json
          .venv/bin/python - <<'PY'
          import json
          report = json.load(open('shadow-observation.json', encoding='utf-8'))
          assert report['status'] == 'observation_passed', report
          assert report['decision']['observation_gate_passed'] is True, report
          assert report['decision']['primary_read_authorized'] is False, report
          assert set(report['domains']) == {
              'users', 'user_data', 'collections', 'user_uploads',
              'custom_meta', 'allowed_emails',
          }, report
          PY

          if grep -Eq 'Your verification code is|Your password reset code is' legacy-server.log sqlite-server.log; then
            echo 'Auth workflow leaked a fixture code to a server log.'
            exit 1
          fi

          if grep -q '\[STATE-DUAL-WRITE\]\[ERROR\]' legacy-server.log sqlite-server.log; then
            cat legacy-server.log sqlite-server.log
            exit 1
          fi

          PYTHONPATH=. PORT=5004 STATE_READ_BACKEND=legacy \
            STATE_READ_SHADOW_COMPARE=0 ARCHIVEDB_AUTH_TEST_MODE=1 \
            .venv/bin/python .runtime/source/gallery_app.py > rollback-control.log 2>&1 &
          LEGACY_PID=$!
          wait_for_server 5004 "$LEGACY_PID" rollback-control.log

          kill "$CANDIDATE_PID"
          wait "$CANDIDATE_PID" || true
          CANDIDATE_PID=""

          PYTHONPATH=. PORT=5005 STATE_READ_BACKEND=legacy \
            STATE_READ_SHADOW_COMPARE=0 ARCHIVEDB_AUTH_TEST_MODE=1 \
            .venv/bin/python .runtime/source/gallery_app.py > rollback-server.log 2>&1 &
          CANDIDATE_PID=$!
          wait_for_server 5005 "$CANDIDATE_PID" rollback-server.log

          ARCHIVEDB_CANDIDATE_URL=http://127.0.0.1:5005 \
            PYTHONPATH=. .venv/bin/python tests/runtime_read_parity.py

          if grep -q '\[STATE-READ-SHADOW\]' rollback-control.log rollback-server.log; then
            echo 'Legacy rollback unexpectedly performed shadow comparisons.'
            cat rollback-control.log rollback-server.log
            exit 1
          fi
          if grep -Eq 'StateReadError|StateReadComparisonError|\[STATE-DUAL-WRITE\]\[ERROR\]' rollback-control.log rollback-server.log; then
            cat rollback-control.log rollback-server.log
            exit 1
          fi
