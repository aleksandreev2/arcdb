name: Python CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax-and-imports:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Materialize source baseline
        run: python scripts/materialize_baseline.py
      - name: Compile Python sources
        run: >-
          python -m py_compile
          .runtime/source/gallery_app.py
          arcdb/storage/sqlite_db.py
          arcdb/storage/legacy_import.py
          arcdb/storage/safe_migration.py
          arcdb/storage/runtime_state.py
          arcdb/storage/runtime_reads.py
          arcdb/storage/state_parity.py
          scripts/dev_bootstrap.py
          scripts/dev_seed.py
          scripts/dev_seed_library.py
          scripts/migrate_state_to_sqlite.py
          scripts/verify_migration_backup.py
          scripts/export_sqlite_to_legacy.py
          scripts/verify_state_parity.py
          scripts/runtime_overlays.py
          scripts/materialize_baseline.py
          tests/make_seed_fixtures.py
          tests/test_sqlite_state.py
          tests/test_safe_migration.py
          tests/test_runtime_state.py
          tests/test_runtime_reads.py
          tests/test_runtime_users.py
          tests/test_runtime_metadata.py
          tests/test_runtime_overlays.py
          tests/test_dev_seed.py
          tests/runtime_collection_workflow.py
          tests/runtime_metadata_workflow.py
          tests/runtime_auth_workflow.py
          tests/runtime_read_parity.py
      - name: Verify required templates
        run: |
          test -f .runtime/source/templates/login.html
          test -f .runtime/source/templates/gallery.html
          test -f .runtime/source/templates/reader.html

  local-bootstrap-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start ArchiveDB through the real local bootstrap
        shell: bash
        run: |
          set -euo pipefail
          CI=1 python scripts/dev_bootstrap.py > server.log 2>&1 &
          BOOT_PID=$!
          cleanup() {
            pkill -P "$BOOT_PID" 2>/dev/null || true
            kill "$BOOT_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 120); do
            if curl --fail --silent --show-error http://127.0.0.1:5004/login >/dev/null; then
              echo "ArchiveDB local bootstrap smoke test passed."
              exit 0
            fi
            if ! kill -0 "$BOOT_PID" 2>/dev/null; then
              echo "Bootstrap exited before the server became ready."
              cat server.log
              exit 1
            fi
            sleep 1
          done

          echo "Server did not become ready in time."
          cat server.log
          exit 1

  dev-seed-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare local environment without starting Flask
        run: CI=1 python scripts/dev_bootstrap.py --setup-only
      - name: Build lightweight EPUB seed fixtures
        run: .venv/bin/python tests/make_seed_fixtures.py dev-fixtures/inbox/Downloads.zip
      - name: Auto-seed empty library through bootstrap
        run: CI=1 python scripts/dev_bootstrap.py --setup-only --auto-seed-if-empty
      - name: Verify generated seed state
        run: |
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('data/dev-seed-report.json').read_text(encoding='utf-8'))
          assert report['epub_count'] == 8, report
          assert len(report['imported']) == 8, report
          assert Path('data/structured_output/422601').is_dir()
          assert Path('data/structured_output/900001').is_dir()
          assert Path('data/structured_output/900002').is_dir()
          assert len(list(Path('data/batched_epubs').glob('*.epub'))) == 5
          PY
      - name: Verify seeded state shadow parity
        run: PYTHONPATH=. .venv/bin/python scripts/verify_state_parity.py
      - name: Start seeded ArchiveDB and verify library API
        shell: bash
        run: |
          set -euo pipefail
          CI=1 python scripts/dev_bootstrap.py > server.log 2>&1 &
          BOOT_PID=$!
          cleanup() {
            pkill -P "$BOOT_PID" 2>/dev/null || true
            kill "$BOOT_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:5004/login >/dev/null; then
              break
            fi
            if ! kill -0 "$BOOT_PID" 2>/dev/null; then
              cat server.log
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent --show-error \
            -c cookies.txt \
            -d 'email=dev@arcdb.local&password=arcdb-dev-123' \
            -X POST http://127.0.0.1:5004/login >/dev/null

          curl --fail --silent --show-error \
            -b cookies.txt \
            -H 'Content-Type: application/json' \
            -d '{"page":1,"limit":50}' \
            http://127.0.0.1:5004/api/library > library.json

          .venv/bin/python - <<'PY'
          import json
          data = json.load(open('library.json', encoding='utf-8'))
          assert data['total'] >= 7, data
          assert '422601' in {str(n['id']) for n in data['novels']}, data
          assert '900001' in {str(n['id']) for n in data['novels']}, data
          assert '900002' in {str(n['id']) for n in data['novels']}, data
          assert '422601' in data['userData'], data
          print(f"Seeded API smoke test passed with {data['total']} novels.")
          PY

  sqlite-state-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare and seed local state
        run: |
          CI=1 python scripts/dev_bootstrap.py --setup-only
          .venv/bin/python tests/make_seed_fixtures.py dev-fixtures/inbox/Downloads.zip
          CI=1 python scripts/dev_bootstrap.py --setup-only --auto-seed-if-empty
      - name: Run SQLite and migration safety unit tests
        run: >-
          PYTHONPATH=. .venv/bin/python -m unittest -v
          tests/test_sqlite_state.py
          tests/test_safe_migration.py
          tests/test_runtime_state.py
          tests/test_runtime_reads.py
          tests/test_runtime_users.py
          tests/test_runtime_metadata.py
          tests/test_runtime_overlays.py
          tests/test_dev_seed.py
      - name: Checkpoint current local shadow before explicit migration test
        run: |
          PYTHONPATH=. .venv/bin/python - <<'PY'
          import sqlite3
          conn = sqlite3.connect('data/arcdb.sqlite3')
          try:
              result = conn.execute('PRAGMA wal_checkpoint(TRUNCATE)').fetchone()
              assert result[0] == 0, result
          finally:
              conn.close()
          PY
      - name: First safe migration to SQLite WAL
        run: PYTHONPATH=. .venv/bin/python scripts/migrate_state_to_sqlite.py --verify --require-core
      - name: Repeat migration and preserve previous SQLite
        run: PYTHONPATH=. .venv/bin/python scripts/migrate_state_to_sqlite.py --verify --require-core
      - name: Verify migration artifacts and legacy sources still exist
        shell: bash
        run: |
          set -euo pipefail
          test -f data/arcdb.sqlite3
          test -f data/metadata/users.json
          test -f data/metadata/user_data.json
          test -f data/metadata/collections.json
          test $(find data/migration-backups -name manifest.json | wc -l) -ge 2
          test $(find data/migration-backups -path '*previous-sqlite/*.verified-copy' | wc -l) -ge 1
          test $(find data/migration-backups -path '*previous-sqlite/*.pre-migration-original' | wc -l) -ge 1
          LATEST=$(find data/migration-backups -mindepth 1 -maxdepth 1 -type d | sort | tail -n1)
          PYTHONPATH=. .venv/bin/python scripts/verify_migration_backup.py "$LATEST" --check-current-sources
      - name: Verify reverse export path without overwriting legacy files
        run: |
          PYTHONPATH=. .venv/bin/python scripts/export_sqlite_to_legacy.py \
            --db data/arcdb.sqlite3 \
            --output-dir data/legacy-export-test
          test -f data/legacy-export-test/users.json
          test -f data/legacy-export-test/user_data.json
          test -f data/legacy-export-test/collections.json
          test -f data/legacy-export-test/manifest.json
