name: Inspect collection routes

on:
  pull_request:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize baseline
        run: python scripts/materialize_baseline.py
      - name: Print collection route sections
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('.runtime/source/gallery_app.py').read_text(encoding='utf-8')
          starts = [m.start() for m in re.finditer(r'@app\.route\([^\n]*(?:collection|collections)[^\n]*\)', text, flags=re.I)]
          print(f'ROUTE_MATCHES={len(starts)}')
          for i, start in enumerate(starts):
              next_route = text.find('\n@app.route(', start + 1)
              end = len(text) if next_route < 0 else next_route
              section = text[start:min(end, start + 9000)]
              print(f'\n===== COLLECTION SECTION {i+1} =====\n{section}\n')
          print('\n===== MUTATE_USER_DATA CALLS NEAR COLLECTION TEXT =====')
          lines = text.splitlines()
          for idx, line in enumerate(lines):
              if 'collection' in line.lower() and ('mutate_user_data' in line or '@app.route' in line or 'def ' in line):
                  lo=max(0,idx-4); hi=min(len(lines),idx+15)
                  print(f'\n--- lines {lo+1}-{hi} ---')
                  print('\n'.join(f'{j+1}: {lines[j]}' for j in range(lo,hi)))
          PY
